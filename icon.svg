<svg width="500" height="380" viewBox="0 0 500 380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Anvil plugin logo</title>
<desc>A stylized dark anvil in side profile with an orange spark and code-bracket motif above it, on a solid dark backdrop.</desc>
<defs>
<linearGradient id="sparkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#ffb84d"/>
<stop offset="100%" stop-color="#ff7a1a"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="500" height="380" fill="#17171b"/>

<!-- Anvil, side profile -->
<g fill="#8a8a94">
<!-- feet / base -->
<path d="M188 316 L178 336 L200 336 L207 316 Z"/>
<path d="M312 316 L319 336 L341 336 L331 316 Z"/>
<!-- base block -->
<rect x="182" y="295" width="136" height="21" rx="3"/>
<!-- waist, narrows sharply -->
<path d="M215 295 L226 246 Q228 238 236 238 L274 238 Q282 238 284 246 L295 295 Z"/>
<!-- body under the table, flares out to meet waist -->
<path d="M198 238 Q198 206 230 200 L280 200 Q312 206 312 238 L295 238 L215 238 Z"/>
<!-- table top, flat rectangular slab -->
<rect x="192" y="182" width="166" height="18" rx="3"/>
<!-- horn, long tapering cone extending left -->
<path d="M192 187 Q190 191 192 196 L108 199 Q96 193 108 185 Z"/>
<!-- hardy hole in the table -->
<rect x="326" y="187" width="10" height="7" rx="1.5" fill="#17171b"/>
</g>

<!-- Spark / bracket motif above the anvil -->
<path d="M259 62 L230 126 L252 126 L240 162 L288 105 L263 105 Z" fill="url(#sparkGrad)"/>

<!-- Code bracket accents flanking the spark -->
<g stroke="#ff7a1a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M197 84 L171 84 L171 146 L197 146"/>
<path d="M321 84 L347 84 L347 146 L321 146"/>
</g>
</svg>
